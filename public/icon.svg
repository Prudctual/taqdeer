<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Primary Gradient (Royal Blue to Cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Highlight Arc Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Analytics Ring Arc -->
  <path d="M 120 360 A 180 180 0 1 1 400 360" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="400 100" />
  
  <!-- Stylized Letter 'ت' Body + Dynamic Trend Curve -->
  <g filter="url(#glow)">
    <!-- Base Curve / Dynamic Football Trajectory -->
    <path d="M 140 330 Q 256 420 372 330" fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" />
    <path d="M 140 330 Q 256 420 372 330" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round" opacity="0.6" />

    <!-- Two Dots of Arabic Letter 'ت' (Styled as Twin Prediction Nodes) -->
    <circle cx="210" cy="180" r="32" fill="url(#goldGrad)" />
    <circle cx="302" cy="180" r="32" fill="url(#goldGrad)" />
    
    <!-- Inner High-Precision Center Target Dot -->
    <circle cx="210" cy="180" r="12" fill="#ffffff" />
    <circle cx="302" cy="180" r="12" fill="#ffffff" />
  </g>

  <!-- Pulse Ring for Predictive Intelligence -->
  <circle cx="256" cy="285" r="14" fill="#38bdf8" />
  <circle cx="256" cy="285" r="28" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.4" />
</svg>
