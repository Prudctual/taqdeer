<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHaaland" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#1c4370" />
    </linearGradient>
    <linearGradient id="skinH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4cf" />
      <stop offset="100%" stop-color="#f5ceb0" />
    </linearGradient>
    <linearGradient id="jerseySky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6cabdd" />
      <stop offset="100%" stop-color="#3882c4" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bgHaaland)" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="#38bdf8" stroke-width="4" />

  <!-- Torso / Sky Blue Jersey -->
  <path d="M 35 200 C 35 145 165 145 165 200 Z" fill="url(#jerseySky)" />
  <path d="M 80 155 L 100 175 L 120 155 Z" fill="#ffffff" />

  <!-- Neck -->
  <rect x="82" y="120" width="36" height="38" rx="8" fill="url(#skinH)" />

  <!-- Head -->
  <ellipse cx="100" cy="94" rx="38" ry="46" fill="url(#skinH)" />

  <!-- Blonde Hair (Haaland ponytail/long blonde hair) -->
  <path d="M 58 92 C 55 52 75 42 100 42 C 125 42 145 52 142 92 C 135 68 118 56 100 56 C 82 56 65 68 58 92 Z" fill="#fbbf24" />
  <!-- Ponytail top knot -->
  <circle cx="100" cy="38" r="12" fill="#f59e0b" />

  <!-- Eyes & Eyebrows -->
  <path d="M 74 80 Q 84 75 92 80" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  <path d="M 108 80 Q 116 75 126 80" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="84" cy="88" rx="4" ry="3" fill="#0284c7" />
  <ellipse cx="116" cy="88" rx="4" ry="3" fill="#0284c7" />

  <!-- Intense Mouth -->
  <path d="M 86 116 Q 100 124 114 116" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" />

  <!-- Text Label Badge -->
  <rect x="35" y="165" width="130" height="24" rx="12" fill="#6cabdd" stroke="#ffffff" stroke-width="2" />
  <text x="100" y="181" text-anchor="middle" fill="#0c2340" font-family="sans-serif" font-size="11" font-weight="900">HAALAND #9</text>
</svg>
