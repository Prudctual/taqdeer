  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bgJude)" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="#fbbf24" stroke-width="4" />

  <!-- Torso / Real Madrid White Jersey with Gold -->
  <path d="M 35 200 C 35 145 165 145 165 200 Z" fill="#ffffff" />
  <path d="M 80 155 L 100 175 L 120 155 Z" fill="#febe10" />

